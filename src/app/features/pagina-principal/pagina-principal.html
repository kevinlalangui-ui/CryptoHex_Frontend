<div class="fondo">
  <div class="content pt-5 ps-4">
    <div class="mb-5"><h3 class="text-light fw-bold">CRYPTOHEX</h3></div>

    <div id="barra-busqueda" class=" d-flex  align-items-center px-2 py-3 gap-2">
      <div class="ps-1">
        <i class="bi bi-search text-white"></i>
      </div>
      <div class="container">
        <input class="" type="text" placeholder="Search for tokens, addresses, entities ...">
      </div>

      <div class="right-icons d-flex gap-1 align-items-center  pe-3">
        <i class="bi bi-chevron-down text-white"></i>
        <i class="bi bi-link-45deg text-white"></i>
        <span class="text-white text-nowrap">| ALL NETWORKS</span>
      </div>
    </div>

    <div class="text-center pt-3 mt-5"><h4 class="text-light fw-bold">Trending Insights</h4></div>
    <div class="lista-tweets w-90 d-flex gap-3 justify-content-center ">
      @for (tweet of tweets(); track tweet.id ){
        @if($index <5){
        <div class="contenedor-tweet">
          <div class="contenedor-etiquetas d-flex gap-2">
            @if(tweet.tag1){
              <span [ngClass]="getEstilo(tweet.tag1)">{{tweet.tag1 }}</span>
            }
            @if(tweet.tag2){
              <span [ngClass]="getEstilo(tweet.tag2)">{{tweet.tag2 }}</span>
            }
            @if(tweet.tag3){
              <span [ngClass]="getEstilo(tweet.tag3)">{{tweet.tag3 }}</span>
            }
          </div>
          <p class="tweet-titulo mt-2">{{tweet.contenido}}</p>
          <p class="letra-token"><span class="etiqueta-token">Token: {{tweet.token}}</span></p>
          <div>
            <span class="tweet-tiempo">{{tweet.fecha_creacion | date:'short'}}</span>
          </div>
        </div>
      }
      }

    </div>

  </div>

</div>
